name: Deploy English Site to Alibaba ECS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & Cache
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Inject Environment Variables
        env:
          FRONTEND_ENVS: ${{ secrets.FRONTEND_ENVS }}
        run: |
          if [ -n "$FRONTEND_ENVS" ]; then
            printf "%s\n" "$FRONTEND_ENVS" > .env
          fi

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build GDKYD English Project
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY || secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST || secrets.HOSTINGER_HOST || secrets.HOST_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF
          chmod 600 ~/.ssh/config
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to Alibaba ECS
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || secrets.HOSTINGER_HOST || secrets.HOST_IP }}
          EC2_USER: ${{ secrets.EC2_USER || secrets.HOSTINGER_USER || 'root' }}
        run: |
          ssh -i ~/.ssh/id_rsa \(EC2_USER@\)EC2_HOST "mkdir -p ~/gdkyd-english-frontend"

          rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            . \(EC2_USER@\)EC2_HOST:~/gdkyd-english-frontend/

          ssh -i ~/.ssh/id_rsa \(EC2_USER@\)EC2_HOST << 'EOF'
            export PATH=\(HOME/.local/share/fnm:\)PATH:\(HOME/.npm-global/bin:/usr/local/bin:/usr/bin:\)PATH
            which fnm >/dev/null 2>&1 && eval "`fnm env`"
            
            cd ~/gdkyd-english-frontend
            
            npm config set registry https://registry.npmmirror.com

            if [ ! -d "node_modules" ] || [ package.json -nt node_modules ]; then
              npm install --omit=dev --legacy-peer-deps
              touch node_modules
            fi

            pm2 describe gdkyd-english-frontend > /dev/null 2>&1 \
              && pm2 reload gdkyd-english-frontend --update-env \
              || PORT=3001 pm2 start node_modules/next/dist/bin/next --name "gdkyd-english-frontend" -- start -p 3001
            
            pm2 save
          EOF