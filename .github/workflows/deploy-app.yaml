name: Deploy to Hostinger VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Next.js Application
        run: npm run build

      # Configure SSH Connection Safely
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY || secrets.EC2_SSH_PRIVATE_KEY }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST || secrets.EC2_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/id_rsa
          ${{ secrets.HOSTINGER_SSH_KEY || secrets.EC2_SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p $SSH_PORT -H $HOSTINGER_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

      # Deploy Application to Hostinger VPS
      - name: Deploy to Hostinger VPS
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST || secrets.EC2_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER || secrets.EC2_USER || 'root' }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || '22' }}
          TARGET_DIR: /var/www/Gdkyd-Frontend
        run: |
          # 1. Ensure target directory exists on VPS
          ssh -p $SSH_PORT -i ~/.ssh/id_rsa $HOSTINGER_USER@$HOSTINGER_HOST "mkdir -p $TARGET_DIR"

          # 2. Inject environment variables if configured in GitHub Secrets
          if [ -n "${{ secrets.FRONTEND_ENVS }}" ]; then
            cat << 'EOF' > .env.production
          ${{ secrets.FRONTEND_ENVS }}
          EOF
          fi

          # 3. Rsync project files including .next build folder to VPS
          rsync -avz -e "ssh -p $SSH_PORT -i ~/.ssh/id_rsa" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            . $HOSTINGER_USER@$HOSTINGER_HOST:$TARGET_DIR/

          # 4. Install production dependencies and restart PM2 process
          ssh -p $SSH_PORT -i ~/.ssh/id_rsa $HOSTINGER_USER@$HOSTINGER_HOST << 'EOF'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.local/share/fnm:~/.npm-global/bin

            cd /var/www/Gdkyd-Frontend

            # Install production dependencies
            npm install --omit=dev --legacy-peer-deps || npm install --production

            # Reload or restart PM2 process for gdkyd-frontend
            pm2 restart gdkyd-frontend || pm2 start npm --name "gdkyd-frontend" -- start

            # Save PM2 process list
            pm2 save
          EOF
