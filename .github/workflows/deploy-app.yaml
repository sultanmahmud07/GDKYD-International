name: Deploy to Alibaba ECS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm ci || npm install --frozen-lockfile

      - name: Build GDKYD English Project
        run: npm run build

      # Configure SSH Safely
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/id_rsa
          ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # Deploy to Alibaba ECS
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          # 1. Create a specific directory for the GDKYD English frontend
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST "mkdir -p ~/gdkyd-english-frontend"

          # 2. Create the .env file locally from GitHub Secrets (e.g., NEXT_PUBLIC_API_URL)
          if [ -n "${{ secrets.FRONTEND_ENVS }}" ]; then
            cat << 'EOF' > .env
          ${{ secrets.FRONTEND_ENVS }}
          EOF
          fi

          # 3. Copy files to ECS instance (including the .next build folder)
          rsync -avz -e "ssh -i ~/.ssh/id_rsa" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            . $EC2_USER@$EC2_HOST:~/gdkyd-english-frontend/

          # 4. Execute deployment commands safely
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST << 'EOF'
            export PATH=$HOME/.local/share/fnm:$PATH
            which fnm >/dev/null 2>&1 && eval "`fnm env`"
            
            npm install -g pm2
            
            cd ~/gdkyd-english-frontend
            
            # Install production dependencies
            npm install --production --legacy-peer-deps || npm install --production
            
            # Restart or start the GDKYD English PM2 process on Port 3001
            pm2 restart gdkyd-english-frontend || PORT=3001 pm2 start npm --name "gdkyd-english-frontend" -- start -- -p 3001
            
            pm2 save
          EOF
