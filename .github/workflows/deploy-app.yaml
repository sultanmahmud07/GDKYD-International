name: Deploy to Alibaba ECS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm ci || npm install --frozen-lockfile

      - name: Build GDKYD English Project
        run: npm run build

      # Configure SSH Safely
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY || secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST || secrets.HOSTINGER_HOST || secrets.HOST_IP }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::SSH Private Key is missing! Please add EC2_SSH_PRIVATE_KEY to your GitHub Repository Secrets."
            exit 1
          fi
          if [ -z "$EC2_HOST" ]; then
            echo "::error::Server IP/Host is missing! Please add EC2_HOST to your GitHub Repository Secrets."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Setup SSH config to avoid host key verification issues
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF
          chmod 600 ~/.ssh/config

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # Deploy to Alibaba ECS
      - name: Deploy to Alibaba ECS
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || secrets.HOSTINGER_HOST || secrets.HOST_IP }}
          EC2_USER: ${{ secrets.EC2_USER || secrets.HOSTINGER_USER || 'root' }}
        run: |
          # 1. Create a specific directory for the GDKYD English frontend
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST "mkdir -p ~/gdkyd-english-frontend"

          # 2. Create the .env file locally from GitHub Secrets if provided
          if [ -n "${{ secrets.FRONTEND_ENVS }}" ]; then
            cat << 'EOF' > .env
          ${{ secrets.FRONTEND_ENVS }}
          EOF
          fi

          # 3. Copy files to ECS instance (including the .next build folder)
          rsync -avz -e "ssh -i ~/.ssh/id_rsa" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            . $EC2_USER@$EC2_HOST:~/gdkyd-english-frontend/

          # 4. Execute deployment commands safely
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST << 'EOF'
            export PATH=$HOME/.local/share/fnm:$PATH
            which fnm >/dev/null 2>&1 && eval "`fnm env`"
            
            # Ensure PM2 is installed globally
            which pm2 >/dev/null 2>&1 || npm install -g pm2
            
            cd ~/gdkyd-english-frontend
            
            # Install dependencies on server
            npm install --legacy-peer-deps || npm install

            # Delete old crashed process if in error state, then start on Port 3001
            pm2 delete gdkyd-english-frontend 2>/dev/null || true
            PORT=3001 pm2 start npm --name "gdkyd-english-frontend" -- start
            
            pm2 save
          EOF
